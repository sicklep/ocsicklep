<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>对话编辑器</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root,body.light{
  --bg-gradient:linear-gradient(135deg,#f4f6fb 0%,#edf1f7 100%);
  --text-color:#2c3e50;--subtitle-color:#7f8c9a;
  --panel-bg:#ffffff;--panel-border:#e0e6ee;--panel-shadow:0 2px 10px rgba(0,0,0,.05);
  --inset-highlight:rgba(255,255,255,.6);--panel-title-color:#34495e;
  --input-bg:#ffffff;--input-border:#ccd4dc;--input-text:#2c3e50;
  --input-focus-border:#4c6ef5;--input-focus-shadow:rgba(76,111,245,.15);
  --placeholder-color:#9aa5b0;
  --btn-bg:linear-gradient(135deg,#4c6ef5,#5f7ff5);--btn-hover-bg:linear-gradient(135deg,#3b5bdb,#4c6ef5);
  --btn-text:#fff;--btn-small-bg:#e1e6eb;--btn-small-border:transparent;--btn-small-text:#2c3e50;--btn-small-hover-bg:#c9d1d8;
  --list-border:#f0f3f7;--chat-bg:#ebedf0;--chat-border:#e8ecf0;--chat-inset-shadow:inset 0 2px 8px rgba(0,0,0,.04);
  --chat-title-bg:rgba(0,0,0,.04);
  --other-bubble-bg:#fff;--other-bubble-text:#333;--other-name-color:#9aa5b0;--bubble-shadow:0 1px 2px rgba(0,0,0,.06);
  --empty-tip-color:#999;--hint-color:#8899aa;--toast-bg:#323232;--toast-text:#fff;
  --avatar-shadow:0 1px 2px rgba(0,0,0,.2);
  --theme-toggle-bg:#4c6ef5;--theme-toggle-text:#fff;
  --modal-bg:rgba(0,0,0,.45);
}
body.dark{
  --bg-gradient:linear-gradient(135deg,#0d1b2a 0%,#152741 50%,#0f1c2e 100%);
  --text-color:#dbe5f0;--subtitle-color:#8ba7c3;
  --panel-bg:rgba(18,32,50,.72);--panel-border:rgba(94,134,175,.25);--panel-shadow:0 8px 32px rgba(0,0,0,.25);
  --inset-highlight:rgba(255,255,255,.04);--panel-title-color:#b8d4f0;
  --input-bg:#12263a;--input-border:rgba(80,120,160,.35);--input-text:#d0ddec;
  --input-focus-border:#4d8fd6;--input-focus-shadow:rgba(77,143,214,.15);
  --placeholder-color:#5a718a;
  --btn-bg:linear-gradient(135deg,#1e4f8a,#2a6ab0);--btn-hover-bg:linear-gradient(135deg,#245a9a,#2f74bd);
  --btn-text:#fff;--btn-small-bg:rgba(65,105,150,.25);--btn-small-border:rgba(90,140,190,.3);--btn-small-text:#cfdbe8;--btn-small-hover-bg:rgba(65,105,150,.45);
  --list-border:rgba(100,140,180,.15);--chat-bg:#152233;--chat-border:rgba(80,120,160,.25);--chat-inset-shadow:inset 0 2px 12px rgba(0,0,0,.3);
  --chat-title-bg:rgba(255,255,255,.05);
  --other-bubble-bg:#223a52;--other-bubble-text:#e2ebf4;--other-name-color:#7f97ad;--bubble-shadow:0 2px 6px rgba(0,0,0,.25);
  --empty-tip-color:#5c768c;--hint-color:#6d89a3;--toast-bg:#1e3a5f;--toast-text:#eaf2fd;
  --avatar-shadow:0 1px 4px rgba(0,0,0,.3);
  --theme-toggle-bg:linear-gradient(135deg,#1e4f8a,#2a6ab0);--theme-toggle-text:#fff;
  --modal-bg:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg-gradient);min-height:100vh;color:var(--text-color);margin:0;transition:background .3s,color .3s}
.container{max-width:1280px;margin:0 auto;padding:32px 24px}
h1{text-align:center;font-size:32px;margin:0 0 28px;letter-spacing:2px}
#theme-toggle{position:fixed;top:20px;right:20px;z-index:1000;padding:8px 16px;font-size:14px;border:1px solid var(--panel-border);border-radius:20px;background:var(--theme-toggle-bg);color:var(--theme-toggle-text);cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#theme-toggle:hover{transform:translateY(-1px)}
.main{display:grid;grid-template-columns:240px 1fr 1fr;gap:16px;align-items:start}
@media(max-width:920px){.main{grid-template-columns:1fr}}
.panel{background:var(--panel-bg);backdrop-filter:blur(12px);border-radius:18px;padding:18px;box-shadow:var(--panel-shadow),inset 0 1px 0 var(--inset-highlight);border:1px solid var(--panel-border);transition:background .3s,border .3s,box-shadow .3s}
.panel h2{font-size:15px;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--list-border);color:var(--panel-title-color)}
.input-group{display:flex;gap:6px;margin-bottom:12px}
input[type=text],select,textarea{padding:7px 9px;border:1px solid var(--input-border);border-radius:8px;font-size:14px;background:var(--input-bg);color:var(--input-text);outline:none;font-family:inherit}
textarea{resize:vertical;width:100%;min-height:120px;line-height:1.5}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--input-focus-border);box-shadow:0 0 0 3px var(--input-focus-shadow)}
::placeholder{color:var(--placeholder-color)}
button{padding:7px 14px;border:1px solid transparent;border-radius:8px;background:var(--btn-bg);color:var(--btn-text);font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
button:hover{background:var(--btn-hover-bg);transform:translateY(-1px)}
button:active{transform:translateY(0)}
.btn-small{padding:2px 8px;font-size:12px;background:var(--btn-small-bg);border:1px solid var(--btn-small-border);color:var(--btn-small-text);box-shadow:none}
.btn-small:hover{background:var(--btn-small-hover-bg);transform:none;box-shadow:none}
#role-list{list-style:none;margin:10px 0 0;padding:0}
#role-list li{display:flex;flex-direction:column;align-items:stretch;padding:8px 0;border-bottom:1px solid var(--list-border)}
.role-row{display:flex;justify-content:space-between;align-items:center}
.role-note{width:100%;margin-top:6px;padding:5px 8px;font-size:12px;border:1px solid var(--input-border);border-radius:6px;background:var(--input-bg);color:var(--input-text);outline:none}
.role-note:focus{border-color:var(--input-focus-border);box-shadow:0 0 0 3px var(--input-focus-shadow)}
.role-avatar{width:28px;height:28px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;flex-shrink:0;text-shadow:0 1px 2px rgba(0,0,0,.3);overflow:hidden;box-shadow:var(--avatar-shadow)}
.role-item-left{display:flex;align-items:center;gap:8px}
.line-row{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.line-row .role-select{min-width:92px}
.line-row .line-text{flex:1}
.line-img-thumb{width:28px;height:28px;border-radius:6px;object-fit:cover;border:1px solid var(--input-border);flex-shrink:0;display:block}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.title-row,.me-select-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:13px;color:var(--subtitle-color)}
.title-row input{flex:1}
.chat-container{background:var(--chat-bg);border-radius:14px;padding:14px;min-height:280px;max-height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;border:1px solid var(--chat-border);box-shadow:var(--chat-inset-shadow)}
.chat-title{text-align:center;font-size:16px;font-weight:500;background:var(--chat-title-bg);color:var(--text-color);margin:-14px -14px 10px;padding:10px 8px;border-bottom:1px solid var(--chat-border);border-radius:14px 14px 0 0;flex-shrink:0}
.chat-msg{display:flex;align-items:flex-start;max-width:100%}
.chat-msg.mine{flex-direction:row-reverse}
.avatar{width:36px;height:36px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;flex-shrink:0;margin:0 8px;text-shadow:0 1px 3px rgba(0,0,0,.35);overflow:hidden;background-size:cover;background-position:center;box-shadow:var(--avatar-shadow)}
.msg-body{display:flex;flex-direction:column;max-width:68%}
.chat-msg.mine .msg-body{align-items:flex-end}
.msg-name{font-size:11px;color:var(--other-name-color);margin-bottom:3px;padding:0 4px}
.msg-bubble{padding:8px 12px;border-radius:10px;background:var(--other-bubble-bg);color:var(--other-bubble-text);font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap;box-shadow:var(--bubble-shadow)}
.msg-bubble img{max-width:180px;display:block;border-radius:6px;margin-bottom:4px}
.msg-bubble img:only-child{margin-bottom:0}
.chat-msg:not(.mine) .msg-bubble{border-top-left-radius:2px}
.chat-msg.mine .msg-bubble{background:#95ec69;color:#1b2a1b;border-top-right-radius:2px}
.empty-tip{text-align:center;color:var(--empty-tip-color);margin:60px 0}
.panel-footer{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.panel-footer button{flex:1;min-width:90px}
.hint{color:var(--hint-color);font-size:12px;margin:8px 0 0;line-height:1.6}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-text);padding:10px 20px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9999;border:1px solid var(--panel-border)}
#toast.show{opacity:1}
/* 弹窗 */
.modal{position:fixed;inset:0;background:var(--modal-bg);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px}
.modal.show{display:flex}
.modal-box{background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:14px;padding:18px;width:100%;max-width:420px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.modal-box h3{margin:0 0 10px;font-size:16px;color:var(--panel-title-color)}
.modal-actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
</style>
</head>
<body class="light">
<button id="theme-toggle" title="切换界面配色">切换</button>
<div class="container">
  <h1>对话编辑器</h1>
  <div class="main">
    <div class="panel">
      <h2>角色管理</h2>
      <div class="input-group">
        <input type="text" id="new-role" placeholder="角色名" />
        <button id="add-role-btn">添加</button>
      </div>
      <button id="batch-add-btn" style="width:100%;margin-bottom:12px">批量添加</button>
      <ul id="role-list"></ul>
      <p class="hint">点击“头像”可为角色上传自定义头像。</p>
    </div>

    <div class="panel">
      <h2>对话编辑</h2>
      <div id="line-list"></div>
      <div class="toolbar">
        <button id="add-line-btn">添加对话</button>
        <button id="clear-btn">清空</button>
      </div>
      <p class="hint">每行可点击“图”上传一张图片（表情包）。</p>
    </div>

    <div class="panel">
      <h2>预览</h2>
      <div class="title-row">
        <span>标题</span>
        <input type="text" id="chat-title" placeholder="群聊名 / 聊天对象" />
      </div>
      <div class="me-select-row">
        <span>我扮演</span>
        <select id="me-select"></select>
        <span class="hint" style="margin:0">（绿色气泡=我）</span>
      </div>
      <div id="capture" class="chat-container"></div>
      <div class="panel-footer">
        <button id="export-img-btn">导出长图</button>
        <button id="export-data-btn">打包数据</button>
        <button id="import-data-btn">导入数据</button>
      </div>
    </div>
  </div>
</div>

<input type="file" id="avatar-upload" accept="image/*" style="display:none" />
<input type="file" id="image-upload" accept="image/*" style="display:none" />
<input type="file" id="data-import" accept=".json" style="display:none" />
<div id="toast"></div>

<!-- 批量添加弹窗 -->
<div class="modal" id="batch-modal">
  <div class="modal-box">
    <h3>批量添加角色</h3>
    <p class="hint" style="margin:0 0 8px">每行一个角色名，空行和重复项会自动忽略。</p>
    <textarea id="batch-input" placeholder="例如：&#10;张三&#10;李四&#10;王五"></textarea>
    <div class="modal-actions">
      <button id="batch-cancel" class="btn-small" style="padding:7px 14px">取消</button>
      <button id="batch-confirm">确认添加</button>
    </div>
  </div>
</div>

<!-- 角色删除确认弹窗 -->
<div class="modal" id="delete-modal">
  <div class="modal-box">
    <h3>删除角色</h3>
    <p id="delete-msg" class="hint" style="margin:0">确定要删除该角色吗？</p>
    <div class="modal-actions">
      <button id="delete-cancel" class="btn-small" style="padding:7px 14px">取消</button>
      <button id="delete-confirm">确认删除</button>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const themeToggle=$('#theme-toggle');
function applyTheme(t){
  document.body.className=t;
  themeToggle.textContent='切换';
  localStorage.setItem('oc-theme',t);
}
applyTheme(localStorage.getItem('oc-theme')||'light');
themeToggle.onclick=()=>applyTheme(document.body.classList.contains('dark')?'light':'dark');

const state={chatTitle:'群聊',roles:['Alice','Bob'],me:'Alice',avatars:{},notes:{},lines:[{role:'Alice',text:'你好，Bob。'},{role:'Bob',text:'你好，Alice。'}]};
const palette=['#ff6b6b','#f59e0b','#4ade80','#38bdf8','#a78bfa','#fb7185','#22d3ee','#f472b6','#84cc16','#e879f9'];
const roleColor=r=>{let h=0;for(let i=0;i<r.length;i++)h=r.charCodeAt(i)+((h<<5)-h);return palette[Math.abs(h)%palette.length]};
const smallBtn=(t,a,r)=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.className='btn-small';b.dataset.action=a;if(r)b.dataset.role=r;return b};

let toastTimer;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}

function setAvatar(el,role){
  const d=state.avatars[role];
  el.style.backgroundImage='none';
  el.style.background=d?'none':roleColor(role);
  el.textContent=d?'':role.trim().charAt(0).toUpperCase();
  if(d){el.style.backgroundImage=`url(${d})`;el.style.backgroundSize='cover';el.style.backgroundPosition='center'}
}

function render(){
  $('#chat-title').value=state.chatTitle;
  const ul=$('#role-list');ul.innerHTML='';
  state.roles.forEach(role=>{
    const li=document.createElement('li');
    const top=document.createElement('div');top.className='role-row';
    const left=document.createElement('div');left.className='role-item-left';
    const av=document.createElement('div');av.className='role-avatar';setAvatar(av,role);
    const nm=document.createElement('span');nm.textContent=role;
    left.append(av,nm);
    const ops=document.createElement('div');
    ops.append(smallBtn('头像','upload-avatar',role),smallBtn('删除','delete-role',role));
    top.append(left,ops);
    const note=document.createElement('input');note.type='text';note.className='role-note';note.placeholder='角色备注（可选）';note.value=state.notes[role]||'';note.dataset.role=role;
    li.append(top,note);ul.appendChild(li);
  });
  const ms=$('#me-select');ms.innerHTML='';
  if(!state.roles.includes(state.me))state.me=state.roles[0]||'';
  state.roles.forEach(r=>ms.add(new Option(r,r)));
  ms.value=state.me;
  const ll=$('#line-list');ll.innerHTML='';
  state.lines.forEach((ln,i)=>{
    const row=document.createElement('div');row.className='line-row';row.dataset.index=i;
    const sel=document.createElement('select');sel.className='role-select';
    sel.add(new Option('选角色',''));
    state.roles.forEach(r=>sel.add(new Option(r,r)));
    if(!state.roles.includes(ln.role))sel.add(new Option(ln.role,ln.role));
    sel.value=ln.role;
    const inp=document.createElement('input');inp.type='text';inp.className='line-text';inp.placeholder='输入台词…';inp.value=ln.text;
    row.append(sel,inp);
    if(ln.image){
      const thumb=document.createElement('img');thumb.className='line-img-thumb';thumb.src=ln.image;thumb.alt='';thumb.title='已附图';
      row.append(thumb);
    }
    row.append(smallBtn('↑','up'),smallBtn('↓','down'));
    const imgBtn=smallBtn(ln.image?'换图':'图','upload-img');row.append(imgBtn);
    if(ln.image)row.append(smallBtn('删图','remove-img'));
    row.append(smallBtn('×','delete'));
    ll.appendChild(row);
  });
  const cap=$('#capture');cap.innerHTML='';
  const hd=document.createElement('div');hd.className='chat-title';hd.textContent=state.chatTitle.trim()||'对话';
  cap.appendChild(hd);
  const valid=state.lines.filter(l=>l.role&&(l.text.trim()||l.image));
  if(!valid.length){const tip=document.createElement('div');tip.className='empty-tip';tip.textContent='暂无对话';cap.appendChild(tip);return}
  valid.forEach(l=>{
    const msg=document.createElement('div');msg.className='chat-msg '+(l.role===state.me?'mine':'other');
    const av=document.createElement('div');av.className='avatar';setAvatar(av,l.role);
    const body=document.createElement('div');body.className='msg-body';
    const name=document.createElement('div');name.className='msg-name';name.textContent=l.role;
    const bub=document.createElement('div');bub.className='msg-bubble';
    if(l.image){
      const img=document.createElement('img');img.src=l.image;img.alt='';
      bub.appendChild(img);
    }
    if(l.text && l.text.trim())bub.appendChild(document.createTextNode(l.text.trim()));
    body.append(name,bub);msg.append(av,body);cap.appendChild(msg);
  });
}

function addRole(name){
  const n=(name!==undefined?name:$('#new-role').value).trim();
  if(!n){alert('请输入角色名');return false}
  if(state.roles.includes(n)){if(name===undefined)toast(`角色“${n}”已存在`);return false}
  state.roles.push(n);state.avatars[n]='';state.notes[n]='';
  if(name===undefined){$('#new-role').value='';render();$('#new-role').focus()}
  return true;
}

/* ===== 批量添加弹窗 ===== */
function batchAdd(){
  const raw=$('#batch-input').value;
  const names=raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!names.length){alert('请至少输入一个角色名');return}
  let added=0,skipped=0;
  names.forEach(n=>{if(addRole(n))added++;else skipped++});
  render();closeBatch();
  toast(skipped?`已添加 ${added} 个，跳过 ${skipped} 个重复`:`已批量添加 ${added} 个角色`);
}
function openBatch(){$('#batch-input').value='';$('#batch-modal').classList.add('show');setTimeout(()=>$('#batch-input').focus(),50)}
function closeBatch(){$('#batch-modal').classList.remove('show')}

/* ===== 角色删除（内置弹窗，替代失效的 confirm） ===== */
let pendingDelete=null;
function askDeleteRole(r){
  pendingDelete=r;
  const lineCount=state.lines.filter(l=>l.role===r).length;
  $('#delete-msg').textContent=lineCount?`删除角色“${r}”及其 ${lineCount} 条对话行？`:`确定要删除角色“${r}”吗？`;
  $('#delete-modal').classList.add('show');
}
function doDeleteRole(){
  const r=pendingDelete;if(!r)return;
  state.roles=state.roles.filter(x=>x!==r);delete state.avatars[r];delete state.notes[r];
  state.lines=state.lines.filter(l=>l.role!==r);
  if(!state.roles.includes(state.me))state.me=state.roles[0]||'';
  pendingDelete=null;closeDelete();render();toast(`已删除角色“${r}”`);
}
function closeDelete(){$('#delete-modal').classList.remove('show')}

/* ===== 对话图片上传 ===== */
let uploadLine=null;
$('#image-upload').onchange=e=>{
  const f=e.target.files[0];if(!f||uploadLine===null)return;
  const rd=new FileReader();
  rd.onload=ev=>{
    state.lines[uploadLine].image=ev.target.result;
    uploadLine=null;render();toast('图片已添加');
  };
  rd.readAsDataURL(f);e.target.value='';
};

/* ===== 角色头像上传 ===== */
let uploadRole=null;
$('#avatar-upload').onchange=e=>{
  const f=e.target.files[0];if(!f||!uploadRole)return;
  const rd=new FileReader();
  rd.onload=ev=>{state.avatars[uploadRole]=ev.target.result;uploadRole=null;render()};
  rd.readAsDataURL(f);e.target.value='';
};

function addLine(){
  if(!state.roles.length){alert('请先添加至少一个角色');return}
  state.lines.push({role:state.roles[0],text:'',image:undefined});render();
  const ins=document.querySelectorAll('.line-text');const last=ins[ins.length-1];if(last)last.focus();
}
function deleteLine(i){state.lines.splice(i,1);render()}
function moveLine(i,d){const n=i+d;if(n<0||n>=state.lines.length)return;[state.lines[i],state.lines[n]]=[state.lines[n],state.lines[i]];render()}
function clearLines(){
  if(state.lines.length===0){toast('已经是空的');return}
  state.lines=[];render();toast('已清空所有对话');
}

function exportImage(){
  const t=$('#capture');
  if(!window.html2canvas){alert('截图库加载失败，请检查网络后重试。');return}
  if(!state.lines.filter(l=>l.role&&(l.text.trim()||l.image)).length){alert('没有对话内容');return}
  toast('正在生成图片…');const pm=t.style.maxHeight;t.style.maxHeight='none';
  const bg=document.body.classList.contains('dark')?'#152233':'#ebedf0';
  html2canvas(t,{scale:2,backgroundColor:bg,useCORS:true}).then(cv=>{
    t.style.maxHeight=pm;const a=document.createElement('a');a.download='对话长图.png';a.href=cv.toDataURL('image/png');a.click();toast('长图已导出');
  }).catch(err=>{t.style.maxHeight=pm;alert('生成长图失败：'+err.message)});
}

function exportData(){
  const data={app:'对话编辑器',version:4,chatTitle:state.chatTitle,roles:state.roles,me:state.me,avatars:state.avatars,notes:state.notes,lines:state.lines};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='对话数据.json';a.click();
  URL.revokeObjectURL(url);toast('数据已打包');
}

$('#data-import').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(!d||!Array.isArray(d.roles)||!Array.isArray(d.lines))throw new Error('文件格式不正确');
      if(!confirm('导入数据会覆盖当前所有角色和对话，确定继续吗？'))return;
      state.chatTitle=d.chatTitle!==undefined?d.chatTitle:'群聊';
      state.roles=d.roles;state.me=d.me&&d.roles.includes(d.me)?d.me:d.roles[0]||'';
      state.avatars=d.avatars||{};state.notes=d.notes||{};
      state.roles.forEach(r=>{if(!state.avatars[r])state.avatars[r]=''});
      state.lines=d.lines.map(l=>({role:l.role||'',text:l.text||'',image:l.image||undefined}));
      render();toast('数据已复原');
    }catch(err){alert('导入失败：'+err.message)}
  };
  rd.readAsText(f,'utf-8');e.target.value='';
};

$('#add-role-btn').onclick=()=>addRole();
$('#new-role').addEventListener('keydown',e=>{if(e.key==='Enter')addRole()});
$('#batch-add-btn').onclick=openBatch;
$('#batch-confirm').onclick=batchAdd;
$('#batch-cancel').onclick=closeBatch;
$('#batch-modal').addEventListener('click',e=>{if(e.target===$('#batch-modal'))closeBatch()});
$('#delete-confirm').onclick=doDeleteRole;
$('#delete-cancel').onclick=closeDelete;
$('#delete-modal').addEventListener('click',e=>{if(e.target===$('#delete-modal'))closeDelete()});
$('#add-line-btn').onclick=addLine;
$('#clear-btn').onclick=clearLines;
$('#export-img-btn').onclick=exportImage;
$('#export-data-btn').onclick=exportData;
$('#import-data-btn').onclick=()=>$('#data-import').click();
$('#me-select').onchange=e=>{state.me=e.target.value;render()};
$('#chat-title').addEventListener('input',e=>{state.chatTitle=e.target.value;render()});

document.addEventListener('click',e=>{
  const b=e.target.closest('button[data-action]');if(!b)return;
  const {action,role}=b.dataset;const ri=b.closest('.line-row')?.dataset.index;
  if(action==='delete-role')askDeleteRole(role);
  else if(action==='upload-avatar'){uploadRole=role;$('#avatar-upload').click()}
  else if(action==='upload-img'){uploadLine=+ri;$('#image-upload').click()}
  else if(action==='remove-img'){const i=+ri;state.lines[i].image=undefined;render();toast('图片已移除')}
  else if(action==='delete')deleteLine(+ri);
  else if(action==='up')moveLine(+ri,-1);
  else if(action==='down')moveLine(+ri,1);
});
document.addEventListener('change',e=>{
  if(e.target.classList.contains('role-select')){const i=e.target.closest('.line-row').dataset.index;state.lines[i].role=e.target.value;render()}
});
document.addEventListener('input',e=>{
  if(e.target.classList.contains('line-text')){const i=e.target.closest('.line-row').dataset.index;state.lines[i].text=e.target.value;render()}
  else if(e.target.classList.contains('role-note')){const r=e.target.dataset.role;state.notes[r]=e.target.value}
});

render();
</script>
</body>
</html>
